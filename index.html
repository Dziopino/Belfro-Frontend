    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Belfero",
        "description": "Narzędzie dla nauczycieli: ze zdjęcia pracy pisemnej najpierw znika imię i nazwisko ucznia, a potem model AI ocenia pracę według klucza odpowiedzi nauczyciela. Wyniki trafiają do statystyk klasy i eksportu PDF.",

    <script>
      /*
       * Bez tego bloku każdy bezwzględny adres w głowie dokumentu byłby zgadywanką: domena
       * produkcyjna istnieje tylko w konfiguracji wdrożenia. Vite podstawia `VITE_SITE_URL` przy
       * budowaniu pakietu; gdy zmiennej nie ma, w kodzie zostaje literal `%VITE_SITE_URL%` i wtedy
       * origin bierzemy z przeglądarki.
       *
       * Kanoniczny adres tworzymy tutaj, a nie w znaczniku, bo `<link rel="canonical" href="/">`
       * jest dla Vite zasobem do osadzenia i budowanie pada. Zapytanie zostaje poza adresem:
       * jednorazowy token nie może być własną kanoniczną kopią.
       */
      (function () {
        var configured = '%VITE_SITE_URL%';
        var origin = /^https?:\/\//.test(configured) ? configured.replace(/\/+$/, '') : window.location.origin;
        var page = origin + (window.location.pathname || '/');

        var canonical = document.querySelector('link[rel="canonical"]');

        if (!canonical) {
          canonical = document.createElement('link');
          canonical.setAttribute('rel', 'canonical');
          document.head.appendChild(canonical);
        }

        canonical.setAttribute('href', page);

        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute('content', page);

        var ogImage = document.querySelector('meta[property="og:image"]');
        if (ogImage) ogImage.setAttribute('content', origin + '/og.png');

        /*
         * Połączenie z originem API ma być gotowe, zanim pierwsze żądanie wyjdzie z aplikacji:
         * bez tego DNS, TCP i TLS dzieją się w środku pierwszego fetcha, a to kilkaset
         * milisekund na każdym nowym połączeniu. Znacznik powstaje tylko gdy konfiguracja podaje
         * pełny adres — bez `VITE_API_URL` zostaje tu literal `%VITE_API_URL%`, a link do takiego
         * „adresu” byłby żądaniem o 404 i śmieciem w konsoli. `crossorigin` jest wymagane, bo
         * żądania CORS bez poświadczeń nie dzielą połączenia z preconnect bez tego atrybutu.
         */
        var apiConfigured = '%VITE_API_URL%';

        if (/^https?:\/\//.test(apiConfigured)) {
          try {
            var apiOrigin = new URL(apiConfigured).origin;

            if (apiOrigin !== window.location.origin) {
              var preconnect = document.createElement('link');
              preconnect.rel = 'preconnect';
              preconnect.href = apiOrigin;
              preconnect.crossOrigin = 'anonymous';
              document.head.appendChild(preconnect);
            }
          } catch (e) {
            // Adres, z którego nie da się zbudować originu, to adres nieużywany — nie wstawiamy niczego.
          }
        }
      })();
    </script>
